- defaults:
    link:
      relink: true

- clean: ["~", "~/.config"]

- link:
    ~/.gitconfig:
      force: true
      path: gitconfig
    ~/.gitignore_global:
      force: true
      path: gitignore_global
    ~/.doom.d: emacs/doom
    ~/.config/nvim:
      create: true
      path: vim/lazyvim-nvim
    ~/.config/fish/config.fish:
      create: true
      force: true
      path: fish/config.fish
    ~/.config/fish/conf.d:
      force: true
      path: fish/conf.d
    ~/.config/fish/functions:
      create: true
      force: true
      path: fish/functions
    ~/.hammerspoon: hammerspoon
    ~/.config/karabiner/karabiner.json:
      create: true
      force: true
      path: karabiner/karabiner.json
    ~/.config/starship.toml: starship.toml
    ~/.hushlogin:
      force: true
      path: hushlogin
    ~/.config/ghostty:
      create: true
      path: ghostty
    ~/.config/zellij/config.kdl:
      create: true
      force: true
      path: zellij/config.kdl
    ~/.config/cmux/cmux.json:
      create: true
      path: cmux/cmux.json
    ~/.pi/agent/settings.json:
      create: true
      force: true
      path: pi/settings.json
    ~/.pi/agent/agents/explorer.md:
      create: true
      path: pi/agents/explorer.md
    ~/.pi/agent/agents/planner.md:
      create: true
      path: pi/agents/planner.md
    ~/.pi/agent/agents/reviewer.md:
      create: true
      path: pi/agents/reviewer.md
    ~/.pi/agent/agents/scout.md:
      create: true
      path: pi/agents/scout.md
    ~/.pi/agent/agents/worker.md:
      create: true
      path: pi/agents/worker.md
    ~/.pi/agent/extensions/exit.ts:
      create: true
      path: pi/extensions/exit.ts
    ~/.pi/agent/extensions/subagent:
      create: true
      path: pi/extensions/subagent
    ~/.pi/agent/prompts/implement.md:
      create: true
      path: pi/prompts/implement.md
    ~/.pi/agent/prompts/implement-and-review.md:
      create: true
      path: pi/prompts/implement-and-review.md
    ~/.pi/agent/prompts/scout-and-plan.md:
      create: true
      path: pi/prompts/scout-and-plan.md
    ~/.agents/skills/cmux:
      create: true
      path: skills/cmux
    ~/.agents/skills/cmux-settings:
      create: true
      path: skills/cmux-settings
    ~/.agents/skills/review-website:
      create: true
      path: skills/review-website
    ~/.agents/skills/rocq-performance-review:
      create: true
      path: skills/rocq-performance-review
    ~/.claude/skills/review-website:
      create: true
      path: skills/review-website
    ~/.claude/skills/rocq-performance-review:
      create: true
      path: skills/rocq-performance-review
    ~/.config/zed/keymap.json:
      create: true
      path: zed/keymap.json
    ~/.config/zed/settings.json:
      create: true
      force: true
      path: zed/settings.json

- shell:
    - macos/defaults.sh
    - [scripts/set-default-shell, Making Fish the default shell]
