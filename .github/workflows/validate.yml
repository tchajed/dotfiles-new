name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes fish jq neovim shellcheck
      - name: Validate dotfiles
        run: ./scripts/validate
